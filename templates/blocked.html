<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #1a1a1a;
  color: #e0e0e0;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 380px;
  background: #252525;
  border: 1px solid #7a1c17;
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.7);
  padding: 36px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.icon { font-size: 36px; }
.title { font-size: 16px; font-weight: 600; color: #f44336; }
.msg { color: #9e9e9e; font-size: 12px; line-height: 1.6; }
.ip {
  font-family: 'JetBrains Mono', monospace;
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 7px 14px;
  font-size: 13px;
  color: #e0e0e0;
}
.footer { color: #424242; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚫</div>
  <div class="title">Access Denied</div>
  <div class="msg">Your IP address is not authorised to access this system.</div>
  <div class="ip">{{ ip }}</div>
  <div class="footer">contact your administrator</div>
</div>
</body>
</html>
